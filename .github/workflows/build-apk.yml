name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Ставит Gradle 8.7 на раннер (wrapper-jar в репозитории не хранится)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-translator-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # При ручном запуске — прикрепляем APK к релизу "continuous"
      - name: Publish APK to release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete continuous -y || true
          gh release create continuous \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Screen Translator — последняя сборка" \
            --notes "Отладочная (debug) сборка, сгенерирована GitHub Actions" \
            --prerelease
